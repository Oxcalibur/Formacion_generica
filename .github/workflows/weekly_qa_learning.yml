name: Auditoría QA Semanal Incremental

on:
  schedule:
    # Todos los lunes a las 08:00 UTC (09:00 CET / 10:00 CEST en España)
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Modo simulación (no actualiza el cursor en Google Sheets ni abre Issue)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  issues: write

jobs:
  weekly-qa-audit:
    runs-on: ubuntu-latest
    environment: seguridad
    steps:
      - name: Checkout rama FormacionInmobiliaria
        uses: actions/checkout@v4
        with:
          ref: FormacionInmobiliaria

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias mínimas de auditoría
        run: |
          python -m pip install --upgrade pip
          pip install google-genai gspread google-auth pandas

      - name: Ejecutar auditoría QA incremental
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GSHEETS_SPREADSHEET_URL: ${{ secrets.GSHEETS_SPREADSHEET_URL }}
          GSHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEETS_SERVICE_ACCOUNT_JSON }}
          PROMPTS_WORKSHEET_NAME: "Prompts_Inmobiliaria"
          QA_WORKSHEET_NAME: "QA_Aprendizajes"
          GEMINI_QA_MODEL: "gemini-2.5-flash"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/weekly_qa_audit.py

      - name: Abrir GitHub Issue con el informe de auto-aprendizajes
        if: ${{ success() && (github.event.inputs.dry_run != 'true') }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('qa_report_meta.json')) {
              core.info('No se generó qa_report_meta.json.');
              return;
            }
            const meta = JSON.parse(fs.readFileSync('qa_report_meta.json', 'utf8'));
            if (!meta.has_report || !fs.existsSync('qa_report_latest.md')) {
              core.info('Sin nuevas interacciones que reportar esta semana.');
              return;
            }
            const body = fs.readFileSync('qa_report_latest.md', 'utf8');
            const title = `🧠 Auditoría QA Semanal (${meta.audit_date}) — ${meta.rows_analyzed} interacciones / ${meta.sessions_analyzed} sesiones`;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body.slice(0, 65000),
            });
            core.info(`Issue creado: #${issue.data.number} (${issue.data.html_url})`);
