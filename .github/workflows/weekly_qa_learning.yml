name: Auditoría QA Semanal Incremental

on:
  schedule:
    # Todos los lunes a las 08:00 UTC (09:00 CET / 10:00 CEST en España)
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Modo simulación (no actualiza el cursor en Google Sheets ni abre Issue/PR)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enable_autofix_pr:
        description: "Generar propuesta automática de mejoras + regresión LIVE + Pull Request"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  weekly-qa-audit:
    runs-on: ubuntu-latest
    environment: seguridad
    steps:
      - name: Checkout rama FormacionInmobiliaria
        uses: actions/checkout@v4
        with:
          ref: FormacionInmobiliaria
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de auditoría y regresión
        run: |
          python -m pip install --upgrade pip
          pip install google-genai gspread google-auth pandas streamlit pypdf

      - name: 1. Ejecutar auditoría QA incremental
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GSHEETS_SPREADSHEET_URL: ${{ secrets.GSHEETS_SPREADSHEET_URL }}
          GSHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEETS_SERVICE_ACCOUNT_JSON }}
          PROMPTS_WORKSHEET_NAME: "Prompts_Inmobiliaria"
          QA_WORKSHEET_NAME: "QA_Aprendizajes"
          GEMINI_QA_MODEL: "gemini-2.5-flash"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/weekly_qa_audit.py

      - name: 2. Abrir GitHub Issue con el informe de auto-aprendizajes
        id: open_issue
        if: ${{ success() && (github.event.inputs.dry_run != 'true') }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('qa_report_meta.json')) {
              core.info('No se generó qa_report_meta.json.');
              core.setOutput('issue_number', '');
              return;
            }
            const meta = JSON.parse(fs.readFileSync('qa_report_meta.json', 'utf8'));
            if (!meta.has_report || !fs.existsSync('qa_report_latest.md')) {
              core.info('Sin nuevas interacciones que reportar esta semana.');
              core.setOutput('issue_number', '');
              return;
            }
            const body = fs.readFileSync('qa_report_latest.md', 'utf8');
            const title = `🧠 Auditoría QA Semanal (${meta.audit_date}) — ${meta.rows_analyzed} interacciones / ${meta.sessions_analyzed} sesiones`;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body.slice(0, 65000),
            });
            core.info(`Issue creado: #${issue.data.number} (${issue.data.html_url})`);
            core.setOutput('issue_number', String(issue.data.number));
            core.setOutput('issue_url', issue.data.html_url);

      - name: 3. Generar mejoras seguras propuestas (Autofix)
        id: autofix
        if: ${{ success() && (github.event.inputs.dry_run != 'true') && (github.event.inputs.enable_autofix_pr != 'false') }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_QA_MODEL: "gemini-2.5-flash"
        run: |
          python scripts/weekly_qa_autofix.py
          python -c "import json, os; m = json.load(open('qa_autofix_meta.json', encoding='utf-8')); f = open(os.environ['GITHUB_OUTPUT'], 'a'); f.write('has_changes=' + ('true' if m.get('has_changes') else 'false') + '\n'); f.write('branch=' + str(m.get('branch', '')) + '\n')"

      - name: 4. Ejecutar Puerta de Regresión LIVE (qa_auto) sobre los cambios propuestos
        id: regression_gate
        if: ${{ steps.autofix.outputs.has_changes == 'true' }}
        continue-on-error: true
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/run_qa_regression.py --mode live

      - name: 5. Crear rama y Pull Request si la regresión LIVE pasa 100 % en verde
        if: ${{ steps.autofix.outputs.has_changes == 'true' && steps.regression_gate.outcome == 'success' }}
        env:
          PR_BRANCH: ${{ steps.autofix.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.open_issue.outputs.issue_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PR_BRANCH"
          git add config.py specialists.py tests/qa_cases.json knowledge_base/
          git commit -m "chore(qa-auto): mejoras semanales verificadas por regresion LIVE (${PR_BRANCH})"
          git push --force origin "$PR_BRANCH"

      - name: 6. Abrir Pull Request contra FormacionInmobiliaria y vincular al Issue
        if: ${{ steps.autofix.outputs.has_changes == 'true' && steps.regression_gate.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const meta = JSON.parse(fs.readFileSync('qa_autofix_meta.json', 'utf8'));
            const summary = fs.existsSync('qa_autofix_summary.md') ? fs.readFileSync('qa_autofix_summary.md', 'utf8') : '';
            const regReport = fs.existsSync('qa_regression_latest.md') ? fs.readFileSync('qa_regression_latest.md', 'utf8') : '';
            const issueNum = '${{ steps.open_issue.outputs.issue_number }}';
            const branch = meta.branch;
            const prTitle = `🤖 Mejoras QA Semanales (${meta.audit_date}) — Regresión LIVE 100 % VERDE`;
            const issueRef = issueNum ? `\nRelacionado con #${issueNum}\n` : '';
            const prBody = [
              summary,
              issueRef,
              '### ✅ Puerta de Regresión LIVE (`qa_auto`) superada al 100 %',
              '',
              '<details><summary>Ver resumen del informe de regresión</summary>',
              '',
              regReport.slice(0, 20000),
              '',
              '</details>',
              '',
              '> **Revisión humana:** revisa el diff y pulsa **Merge pull request** para desplegar en `FormacionInmobiliaria` (o pídele a Antigravity que haga `git fetch origin` sobre la rama `' + branch + '` para revisarlo/ajustarlo).',
            ].join('\n');

            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'FormacionInmobiliaria',
              state: 'open',
            });

            let prUrl = '';
            if (existing.data.length > 0) {
              const updated = await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: existing.data[0].number,
                title: prTitle,
                body: prBody.slice(0, 65000),
              });
              prUrl = updated.data.html_url;
              core.info(`PR actualizado: ${prUrl}`);
            } else {
              const created = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                head: branch,
                base: 'FormacionInmobiliaria',
                body: prBody.slice(0, 65000),
              });
              prUrl = created.data.html_url;
              core.info(`PR creado: ${prUrl}`);
            }

            if (issueNum && prUrl) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(issueNum),
                body: `🤖 **Pull Request automático listo para aprobar (Regresión LIVE 100 % VERDE):** ${prUrl}\nRama para inspección en Antigravity: \`${branch}\``,
              });
            }

      - name: 7. Avisar en el Issue si la regresión LIVE frenó el PR automático
        if: ${{ steps.autofix.outputs.has_changes == 'true' && steps.regression_gate.outcome != 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNum = '${{ steps.open_issue.outputs.issue_number }}';
            if (!issueNum) return;
            const summary = fs.existsSync('qa_autofix_summary.md') ? fs.readFileSync('qa_autofix_summary.md', 'utf8') : '';
            const regReport = fs.existsSync('qa_regression_latest.md') ? fs.readFileSync('qa_regression_latest.md', 'utf8') : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(issueNum),
              body: `⚠️ **Autofix propuso cambios pero la Puerta de Regresión LIVE NO pasó al 100 %, así que NO se ha abierto PR.**\n\n${summary}\n\n<details><summary>Ver informe de regresión</summary>\n\n${regReport.slice(0, 20000)}\n\n</details>`,
            });
